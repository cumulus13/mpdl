name: Build and Release

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Get dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi

      - name: Build all source files
        env:
          CGO_ENABLED: 0
        run: go build -v .

  build:
    name: Build (${{ matrix.output }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86 / x64
          - goos: linux
            goarch: amd64
            output: mpdl-linux-amd64
          - goos: linux
            goarch: '386'
            output: mpdl-linux-386

          # Linux ARM / Raspberry Pi
          - goos: linux
            goarch: arm
            goarm: '6'
            output: mpdl-linux-armv6
          - goos: linux
            goarch: arm
            goarm: '7'
            output: mpdl-linux-armv7
          - goos: linux
            goarch: arm64
            output: mpdl-linux-arm64

          # Android CLI (runs on Termux / Kali NetHunter)
          - goos: linux
            goarch: arm
            goarm: '7'
            output: mpdl-android-armv7
          - goos: linux
            goarch: arm64
            output: mpdl-android-arm64

          # Linux MIPS
          - goos: linux
            goarch: mips
            output: mpdl-linux-mips
          - goos: linux
            goarch: mipsle
            output: mpdl-linux-mipsle
          - goos: linux
            goarch: mips64
            output: mpdl-linux-mips64
          - goos: linux
            goarch: mips64le
            output: mpdl-linux-mips64le

          # Linux Other Architectures
          - goos: linux
            goarch: ppc64le
            output: mpdl-linux-ppc64le
          - goos: linux
            goarch: riscv64
            output: mpdl-linux-riscv64
          - goos: linux
            goarch: s390x
            output: mpdl-linux-s390x

          # Windows
          - goos: windows
            goarch: amd64
            output: mpdl-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: mpdl-windows-arm64.exe
          - goos: windows
            goarch: '386'
            output: mpdl-windows-386.exe

          # macOS
          - goos: darwin
            goarch: amd64
            output: mpdl-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: mpdl-darwin-arm64

          # BSD Family
          - goos: freebsd
            goarch: amd64
            output: mpdl-freebsd-amd64
          - goos: netbsd
            goarch: amd64
            output: mpdl-netbsd-amd64
          - goos: openbsd
            goarch: amd64
            output: mpdl-openbsd-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Get dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          go build -v -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o ${{ matrix.output }} .

      - name: Report binary size
        run: |
          echo "=== Binary Details ==="
          ls -lh ${{ matrix.output }}
          echo "=== Exact Size in Bytes ==="
          stat -c "%s bytes - %n" ${{ matrix.output }} 2>/dev/null || stat -f "%z bytes - %N" ${{ matrix.output }}

      - name: Create archive (Unix)
        if: matrix.goos != 'windows'
        run: |
          tar -czf ${{ matrix.output }}.tar.gz ${{ matrix.output }} README.md LICENSE 2>/dev/null || tar -czf ${{ matrix.output }}.tar.gz ${{ matrix.output }}

      - name: Create archive (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ${{ matrix.output }},README.md,LICENSE -DestinationPath ${{ matrix.output }}.zip

      - name: Upload artifact (Unix)
        if: matrix.goos != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}.tar.gz
          retention-days: 5

      - name: Upload artifact (Windows)
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}.zip
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check for built artifacts
        run: |
          mkdir -p artifacts
          COUNT=$(find artifacts -type f ! -name "checksums.txt" | wc -l)
          echo "Found $COUNT artifacts"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No artifacts were successfully built."
            exit 1
          fi

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            if [ -d "$dir" ]; then
              cd "$dir"
              for file in *; do
                if [ -f "$file" ]; then
                  sha256sum "$file" >> ../../checksums.txt
                fi
              done
              cd ..
            fi
          done
          cd ..
          echo "=== Checksums ==="
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Installation

            ### Linux / macOS
            ```bash
            wget [https://github.com/$](https://github.com/$){{ github.repository }}/releases/download/${{ github.ref_name }}/mpdl-linux-amd64.tar.gz
            tar -xzf mpdl-linux-amd64.tar.gz
            chmod +x mpdl-linux-amd64
            sudo mv mpdl-linux-amd64 /usr/local/bin/mpdl
            ```

            ### Windows
            ```powershell
            # Download mpdl-windows-amd64.exe.zip, extract, add to PATH
            ```

            ### Verify checksums
            ```bash
            sha256sum -c checksums.txt
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}